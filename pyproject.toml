[project]
name = "vastsparks"
version = "0.1.0"
description = "Run Python functions on Vast.ai GPUs with a decorator. A Vast.ai port of runpod-flash."
readme = "README.md"
authors = [{ name = "Chris McKenzie" }]
keywords = ["vast.ai", "gpu", "serverless", "remote execution", "runpod-flash"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "cloudpickle>=3.1.1",
    "httpx>=0.27",
    "pydantic>=2.0.0",
    "rich>=14.0.0",
    "typer>=0.12.0",
]

[project.urls]
Repository = "https://github.com/kristopolous/spark-vast"

[dependency-groups]
dev = ["ruff>=0.6"]
test = ["pytest>=8.4.1", "pytest-asyncio>=1.0.0"]

[project.scripts]
vastsparks = "vastsparks.cli:app"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/vastsparks/cli.py" = ["B008"]  # typer's Option()/Argument() defaults
# The worker must catch everything (it reports user errors back) and exec()s shipped code by design.
"src/vastsparks/worker/server.py" = ["BLE001", "S102"]
